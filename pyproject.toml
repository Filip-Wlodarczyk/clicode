[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cli-code"
version = "0.1.0"
description = "Modern terminal code editor (Linux CLI Code Editor)"
authors = [{ name = "Filip" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80.0",
    "pygments>=2.15.0",
]

[project.scripts]
clicode = "clicode.main:main"

[tool.setuptools.packages.find]
where = ["src"]
